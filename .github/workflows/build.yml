name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PICO_SDK_PATH: ${{ github.workspace }}/dependencies/pico-sdk
  PICO_EXTRAS_PATH: ${{ github.workspace }}/dependencies/pico-extras

jobs:
  build:
    name: Build for ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - pico
          - pico2

    steps:
      - name: Check out firmware
        uses: actions/checkout@v4

      - name: Check out Pico SDK 2.1.1
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.1.1
          path: dependencies/pico-sdk
          submodules: recursive

      - name: Check out pico-extras 2.1.1
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-extras
          ref: sdk-2.1.1
          path: dependencies/pico-extras

      - name: Install Arm build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gcc-arm-none-eabi ninja-build python3

      - name: Configure ${{ matrix.board }}
        run: >-
          cmake -S . -B build/${{ matrix.board }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPICO_BOARD=${{ matrix.board }}

      - name: Build ${{ matrix.board }}
        run: cmake --build build/${{ matrix.board }} --parallel

      - name: Upload ${{ matrix.board }} firmware
        uses: actions/upload-artifact@v4
        with:
          name: p2000t-vid2vga-${{ matrix.board }}
          if-no-files-found: error
          path: |
            build/${{ matrix.board }}/src/p2000t-vid2vga-firmware.uf2
            build/${{ matrix.board }}/src/p2000t-vid2vga-firmware.elf
            build/${{ matrix.board }}/src/p2000t-vid2vga-firmware.bin
            build/${{ matrix.board }}/src/p2000t-vid2vga-firmware.hex
