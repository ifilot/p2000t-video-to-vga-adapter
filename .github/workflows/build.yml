name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.board }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - pico
          - pico2

    steps:
      - name: Check out firmware
        uses: actions/checkout@v5

      - name: Install Arm build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake ninja-build gcc-arm-none-eabi \
            libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            git python3

      - name: Configure ${{ matrix.board }}
        run: >-
          cmake -S . -B build/${{ matrix.board }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPICO_BOARD=${{ matrix.board }}

      - name: Build ${{ matrix.board }}
        run: cmake --build build/${{ matrix.board }} --parallel

      - name: Prepare ${{ matrix.board }} artifacts
        run: |
          mkdir -p dist
          for extension in uf2 elf bin hex; do
            cp "build/${{ matrix.board }}/src/p2000t-vid2vga-firmware.${extension}" \
              "dist/p2000t-vid2vga-${{ matrix.board }}.${extension}"
          done

      - name: Upload ${{ matrix.board }} firmware
        uses: actions/upload-artifact@v4
        with:
          name: p2000t-vid2vga-${{ matrix.board }}
          if-no-files-found: error
          path: dist/*

  viewer-windows:
    name: Build and install-test Windows capture viewer
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install MSYS2 UCRT64 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Install NSIS installer compiler
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Configure Windows capture viewer
        shell: msys2 {0}
        run: |
          cmake -S gui -B build-gui -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build Windows capture viewer
        shell: msys2 {0}
        run: cmake --build build-gui --parallel

      - name: Test Windows capture viewer
        shell: msys2 {0}
        run: ctest --test-dir build-gui --output-on-failure

      - name: Deploy Windows capture viewer
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist/viewer
          cp build-gui/p2000t-vid2vga-capture.exe \
            build-gui/p2000t-vid2vga-lab-agent.exe dist/viewer/
          windeployqt6 --release --no-translations \
            --exclude-plugins qpdf,qsvg,qsvgicon \
            dist/viewer/p2000t-vid2vga-capture.exe
          cp gui/README.md dist/viewer/README.md
          mkdir -p dist/viewer/licenses
          cp LICENSES/GPL-3.0-or-later.txt dist/viewer/licenses/
          cp -R /ucrt64/share/licenses/qt6-base dist/viewer/licenses/
          for pass in 1 2 3; do
            find dist/viewer -type f \( -name '*.exe' -o -name '*.dll' \) \
              -print0 | xargs -0 -r ldd | \
              awk '$3 ~ /^\/ucrt64\/bin\// { print $3 }' | sort -u | \
              xargs -r -I{} cp -n '{}' dist/viewer/
          done

      - name: Create and smoke-test Windows packages
        shell: pwsh
        run: |
          $version = (Get-Content build-gui/package-version.txt -Raw).Trim()
          $archive = "dist/p2000t-vid2vga-capture-windows.zip"
          Compress-Archive -Path dist/viewer/* -DestinationPath $archive
          foreach ($required in @(
            $archive,
            "dist/viewer/p2000t-vid2vga-capture.exe",
            "dist/viewer/p2000t-vid2vga-lab-agent.exe"
          )) {
            if (-not (Test-Path $required -PathType Leaf)) {
              throw "Windows package payload is missing: $required"
            }
          }

          $installer = "dist/p2000t-vid2vga-capture-windows-setup.exe"
          & gui/packaging/create_windows_installer.ps1 `
            -Stage dist/viewer -Version $version -Output $installer `
            -WorkDirectory installer-work
          7z t $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Windows installer integrity check failed."
          }

          $installer = (Resolve-Path $installer).Path
          $smokeDirectory = Join-Path $env:RUNNER_TEMP `
            "p2000t-capture-installer-smoke"
          $firstInstall = Start-Process -FilePath $installer -Wait `
            -PassThru -ArgumentList @("/S", "/D=$smokeDirectory")
          if ($firstInstall.ExitCode -ne 0 -or
              -not (Test-Path `
                "$smokeDirectory/p2000t-vid2vga-capture.exe")) {
            throw "Fresh Windows installation smoke test failed."
          }

          $upgrade = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList @("/S", "/D=$smokeDirectory")
          if ($upgrade.ExitCode -ne 0) {
            throw "Same-directory Windows upgrade smoke test failed."
          }

          $uninstaller = Join-Path $smokeDirectory "uninstall.exe"
          $uninstall = Start-Process -FilePath $uninstaller -Wait `
            -PassThru -ArgumentList "/S"
          if ($uninstall.ExitCode -ne 0 -or
              (Test-Path $smokeDirectory)) {
            throw "Windows uninstaller smoke test failed."
          }

      - name: Upload Windows capture viewer
        uses: actions/upload-artifact@v4
        with:
          name: p2000t-vid2vga-capture-windows
          if-no-files-found: error
          path: |
            dist/p2000t-vid2vga-capture-windows.zip
            dist/p2000t-vid2vga-capture-windows-setup.exe

  screentest:
    name: Build SAA5050 screen-test cartridge
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install cartridge build tools
        run: sudo apt-get update && sudo apt-get install --yes z80asm python3

      - name: Build and verify cartridge
        run: |
          make -C screentest
          make -C screentest verify

      - name: Prepare cartridge artifact
        run: |
          mkdir -p dist
          cp screentest/screentest.bin dist/p2000t-screentest.bin

      - name: Upload screen-test cartridge
        uses: actions/upload-artifact@v4
        with:
          name: p2000t-screentest
          if-no-files-found: error
          path: dist/p2000t-screentest.bin

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - viewer-windows
      - screentest
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: p2000t-*
          path: dist
          merge-multiple: true

      - name: Verify release payload
        run: |
          for artifact in \
            p2000t-vid2vga-pico.uf2 \
            p2000t-vid2vga-pico2.uf2 \
            p2000t-screentest.bin \
            p2000t-vid2vga-capture-windows.zip \
            p2000t-vid2vga-capture-windows-setup.exe; do
            test -s "dist/${artifact}" || {
              echo "Missing release artifact: dist/${artifact}" >&2
              exit 1
            }
          done

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/p2000t-vid2vga-pico.uf2
          dist/p2000t-vid2vga-pico2.uf2
          dist/p2000t-screentest.bin
          dist/p2000t-vid2vga-capture-windows.zip
          dist/p2000t-vid2vga-capture-windows-setup.exe
          --verify-tag
          --generate-notes
          --latest
